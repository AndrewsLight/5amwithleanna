<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>5amwithleanna Anime Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>5amwithleanna Anime Tracker</h1>
    <button onclick="loginAniList()">Login with AniList</button>
  </header>

  <main>
    <!-- AniList Metadata -->
    <section id="anime-info">
      <h2 id="anime-title">Anime Title</h2>
      <img id="anime-poster" alt="Anime Poster">
      <p id="anime-description">Description will appear here.</p>
      <p id="anime-episodes">Episodes: </p>
    </section>

    <!-- Manual Add Form -->
    <section id="manual-add">
      <h3>Add Anime to Continue Watching</h3>
      <input type="text" id="anime-name" placeholder="Anime Name">
      <input type="number" id="episode-number" placeholder="Episode Number">
      <input type="number" id="timestamp" placeholder="Timestamp (seconds)">
      <button onclick="addAnime()">Add</button>
    </section>

    <!-- Continue Watching List -->
    <section id="continue">
      <h3>Continue Watching</h3>
      <div id="continue-list"></div>
    </section>
  </main>

  <footer>
    <p>Powered by AniList API</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
