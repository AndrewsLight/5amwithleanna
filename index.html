<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime Tracker</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./">5AM Anime</a>

    <nav>
      <button data-view="continue">Continue</button>
      <button data-view="watching">Watching</button>
      <button data-view="completed">Completed</button>
      <button data-view="paused">Paused</button>
      <button data-view="dropped">Dropped</button>
      <button data-view="planning">Planning</button>
    </nav>

    <div id="account"></div>
  </header>

  <main class="container">
    <section id="loginView" class="login-view">
      <div class="login-card">
        <p class="eyebrow">YOUR ANIME LIST</p>
        <h1>Your anime.<br>One place.</h1>
        <p class="muted">
          Connect AniList to load your watching progress, completed anime,
          paused shows, dropped shows, and planning list.
        </p>

        <button id="loginButton" class="primary-button">
          Login with AniList
        </button>

        <p id="loginError" class="error"></p>
      </div>
    </section>

    <section id="appView" hidden>
      <div class="hero">
        <div>
          <p class="eyebrow">YOUR LIBRARY</p>
          <h1 id="pageTitle">Continue Watching</h1>
          <p id="pageDescription" class="muted">
            Pick up where you left off.
          </p>
        </div>

        <button id="refreshButton" class="secondary-button">
          Refresh
        </button>
      </div>

      <div id="stats" class="stats"></div>

      <section id="animeGrid" class="anime-grid"></section>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
