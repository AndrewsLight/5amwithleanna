<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>5amwithleanna</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>5amwithleanna Anime Tracker</h1>
    <button onclick="loginAniList()">Login with AniList</button>
  </header>

  <main>
    <!-- Anime Info Section -->
    <section id="anime-info">
      <h2 id="anime-title">Anime Title</h2>
      <img id="anime-poster" alt="Anime Poster">
      <p id="anime-description">Description will appear here.</p>
      <p id="anime-episodes">Episodes: </p>
    </section>

    <!-- Progress Tracking -->
    <section id="progress">
      <h3>Continue Watching</h3>
      <p>Current Episode: <span id="current-episode">0</span></p>
      <p>Timestamp: <span id="current-timestamp">0</span> seconds</p>
      <button onclick="saveProgress()">Save Progress</button>
    </section>

    <!-- Lists Management -->
    <section id="lists">
      <h3>My Lists</h3>
      <select id="anime-status" onchange="updateStatus()">
        <option value="Watching">Watching</option>
        <option value="Completed">Completed</option>
        <option value="Dropped">Dropped</option>
        <option value="Paused">Paused</option>
        <option value="Planning">Planning</option>
        <option value="Favorite">Favorite</option>
      </select>
      <p>Current Status: <span id="status-display">Watching</span></p>
    </section>
  </main>

  <footer>
    <p>Powered by AniList API</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
